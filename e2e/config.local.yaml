# Config overlay used only by the Playwright e2e run.
#
# The server merges this over `config/config.yaml` (via `ILA_CONFIG_PATH`), so the shape
# matches — but every value that matters is replaced: the provider points at the local
# fake LLM, and both the workspaces root and the database are redirected into the
# git-ignored `.e2e/` directory so a test run never touches real data.
#
# `providers` being an array means it is replaced wholesale, not merged, so the real
# entries in config.yaml are entirely out of the picture here.

server:
  port: ${ILA_SERVER_PORT}

workspaces:
  rootDir: ./.e2e/workspaces

defaultProvider: fake
defaultModel: fake-model

providers:
  - id: fake
    name: Fake Provider
    baseURL: ${ILA_FAKE_LLM_URL}
    apiKey: e2e-key
    models:
      - id: fake-model
        name: fake-model
      - id: fake-vision
        name: fake-vision

# A mock cloud parser, used to prove the fallback path in a browser. `local-first` stays
# the policy, so only documents the local extractor cannot read (scanned pages, say) ever
# reach it — which is the whole point of the fallback.
documentParsers:
  - id: mock-cloud
    name: Mock Cloud Parser
    kind: sync
    baseURL: ${ILA_FAKE_PARSER_URL}

documentParsing:
  policy: local-first
  fallbackEnabled: true

tools:
  webSearch:
    provider: bing
  webFetch:
    enabled: true
