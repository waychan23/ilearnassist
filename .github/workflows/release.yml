name: Release

# Packages the desktop app for macOS, Windows and Linux, and attaches the artefacts to a
# GitHub Release.
#
# **Manual by default.** A `workflow_dispatch` run builds the installers and leaves them as
# workflow artefacts, which is what you want while checking that a platform still builds. A
# `v*` tag additionally publishes them onto a Release — so the README's
# `releases/latest` link resolves to something a person can download. Nothing here runs on a
# push to a branch.
#
# **Why CI and not a laptop.** An NSIS installer has to be built on Windows: electron-builder
# needs Windows tooling for it, and running it from macOS or Linux needs wine. Rather than
# document a cross-build that works on one machine and not the next, each platform is built on
# its own runner. GitHub Actions is free and unmetered for public repositories, including the
# macOS runners, which are the expensive ones on a private repo.
#
# **The artefacts are not code-signed.** macOS gets an ad-hoc signature from
# `scripts/after-sign.mjs` (see docs/desktop.md), which turns "damaged and cannot be opened"
# into the ordinary "unidentified developer" prompt; Windows gets nothing, so SmartScreen shows
# its "unrecognised app" warning. Both are documented in the README, because for a
# non-technical user the warning is the first thing they see.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Least privilege for the whole run; the publish job asks for the one extra scope it needs.
permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not cancel the other two: a Windows-only problem is
      # exactly the kind a release run is meant to reveal.
      fail-fast: false
      matrix:
        include:
          - name: mac
            os: macos-latest
            # Both architectures in one job on one runner: they share the Electron cache, and
            # electron-builder produces a separate disk image for each.
            args: --mac --arm64 --x64
          - name: windows
            os: windows-latest
            args: --win --x64
          - name: linux
            os: ubuntu-latest
            args: --linux --x64

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Keep this in step with the engines field in package.json — better-sqlite3 is a
          # native module, and its N-API prebuilds are what the packaged app loads.
          node-version: 22
          cache: pnpm

      # Unlike `ci.yml`, this one does **not** set `ELECTRON_SKIP_BINARY_DOWNLOAD`: packaging
      # needs the Electron binary, and skipping it would fail at the last step.
      - run: pnpm install --frozen-lockfile

      # `build.mjs` bundles the server, the main and preload processes and the renderer, stages
      # the built frontend and the seed config, and copies the tray icons. Running it through
      # electron-builder instead would re-run it and produce the same thing twice.
      - run: pnpm --filter @ilearnassist/desktop build

      - name: Package
        working-directory: apps/desktop
        run: pnpm exec electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ilearnassist-${{ matrix.name }}
          # The installers only. `release/` also holds unpacked trees (`mac-arm64/` and
          # friends) which are hundreds of megabytes and not something anyone downloads.
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
          retention-days: 14

  # A tag publishes what the matrix built. Separate from packaging so that a failed upload
  # cannot look like a failed build, and so the write scope exists only here.
  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # Needed to create the Release. Stated explicitly rather than relying on the repository
      # default, which an organisation can tighten.
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          draft: true
          # The release notes are written by a person. A generated commit list is worse than
          # nothing for the audience this app is for.
          generate_release_notes: false
