# ============================================================================
# ilearnassist configuration
# ----------------------------------------------------------------------------
# This is the single source of truth for providers, models and tools.
# Credentials may be given inline OR referenced from an environment variable
# using the ${ENV_VAR} syntax (e.g. apiKey: ${OPENAI_API_KEY}).
#
# A `config/config.local.yaml` file (git-ignored) may override any of these
# values — useful for keeping real keys out of version control.
# ============================================================================

server:
  host: 127.0.0.1
  port: 3720

# NOTE: where the data lives is *not* here. There is no `data:` or `workspaces:`
# key because the data root is a launcher decision, not a config value: the
# server requires the `ILA_DATA_DIR` environment variable (see `.env.example`)
# and refuses to start without it, so that a path deciding how much of your work
# survives an uninstall is never a default it invented.
#
# Everything per-user lives underneath it — the database at `db/sqlite/`, and
# each account's workspaces and uploaded files under `users/<name>/`.

# The provider used when a conversation has no explicit provider selected.
defaultProvider: deepseek

# The model used when a conversation has no explicit model selected.
defaultModel: deepseek-v4-pro

# ----------------------------------------------------------------------------
# Providers / Models (OpenAI-compatible).
# `baseURL` + `apiKey` are everything LangChain's ChatOpenAI needs to talk to
# OpenAI, DeepSeek, Moonshot, Ollama, LM Studio, vLLM, or any compatible server.
#
# These entries are SEED data: on first boot they are copied into the SQLite
# `providers`/`models` tables, after which the Settings → Providers UI is the
# source of truth. Editing this file later does not overwrite what the UI saved
# (delete the provider in the UI to re-seed it), but it remains the only way to
# supply a key via ${ENV_VAR} rather than typing it into the browser.
# ----------------------------------------------------------------------------
providers:
  # ---------------------------------------------------------------------------
  # The built-in providers.
  #
  # A vendor's Chinese and international endpoints are **two separate entries**, because
  # neither the host nor the API key is interchangeable between them (a Chinese-region key
  # sent to the international host answers 404). Extra entries cost nothing: only a provider
  # whose key is set appears in a conversation's model picker.
  #
  # `capabilities` is how a seed entry says what its models can do, and for the entries below
  # it is always stated rather than left to `guessCapabilities`. That is not tidiness — the
  # three flags change behaviour, not a badge: `vision` decides whether an image travels as
  # an `image_url` or reaches the model as a placeholder, `reasoning` decides whether
  # chain-of-thought is replayed on messages carrying tool calls (DeepSeek 400s without it),
  # `tool_use` decides whether the tools are offered at all. A model id does not reliably say
  # any of it: `glm-5.3` cannot see pictures while `glm-5v-turbo` can, and `kimi-k3` always
  # thinks while `kimi-k2.6` can be told not to.
  #
  # Model ids are the vendors' own and do change. Correcting one is a console edit
  # (控制台 → 模型服务商) — no rebuild.
  # ---------------------------------------------------------------------------

  # ---- DeepSeek ------------------------------------------------------------
  - id: deepseek
    name: DeepSeek
    baseURL: https://api.deepseek.com/v1
    apiKey: ${DEEPSEEK_API_KEY}
    models:
      - id: deepseek-v4-pro
        name: DeepSeek V4 Pro
        capabilities: [tool_use, reasoning]

  # ---- 智谱 GLM / Zhipu GLM ------------------------------------------------
  - id: zhipu
    name: 智谱 GLM
    baseURL: https://open.bigmodel.cn/api/paas/v4
    apiKey: ${ZHIPU_API_KEY}
    models:
      - id: glm-5.3
        name: GLM-5.3
        capabilities: [tool_use, reasoning]
      - id: glm-5.3-flash
        name: GLM-5.3 Flash
        capabilities: [tool_use, reasoning]

  - id: zhipu-intl
    name: 智谱 GLM（国际）
    baseURL: https://api.z.ai/api/paas/v4
    apiKey: ${ZHIPU_INTL_API_KEY}
    models:
      - id: glm-5.3
        name: GLM-5.3
        capabilities: [tool_use, reasoning]
      - id: glm-5.3-flash
        name: GLM-5.3 Flash
        capabilities: [tool_use, reasoning]

  # ---- 通义千问 / Qwen (Alibaba Model Studio) ------------------------------
  # The flat host below is the long-standing one and still works. Model Studio is moving to
  # a workspace-scoped host — https://{WorkspaceId}.{region}.maas.aliyuncs.com/compatible-mode/v1
  # — which needs an id only your console knows, so the seed uses the flat form.
  - id: qwen
    name: 通义千问
    baseURL: https://dashscope.aliyuncs.com/compatible-mode/v1
    apiKey: ${DASHSCOPE_API_KEY}
    models:
      - id: qwen3.8-max
        name: Qwen3.8 Max
        capabilities: [tool_use, reasoning, vision]
      - id: qwen3.8-flash
        name: Qwen3.8 Flash
        capabilities: [tool_use, reasoning, vision]

  - id: qwen-intl
    name: 通义千问（国际）
    baseURL: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    apiKey: ${DASHSCOPE_INTL_API_KEY}
    models:
      - id: qwen3.8-max
        name: Qwen3.8 Max
        capabilities: [tool_use, reasoning, vision]
      - id: qwen3.8-flash
        name: Qwen3.8 Flash
        capabilities: [tool_use, reasoning, vision]

  # ---- Kimi / Moonshot -----------------------------------------------------
  - id: kimi
    name: Kimi
    baseURL: https://api.moonshot.cn/v1
    apiKey: ${MOONSHOT_API_KEY}
    models:
      - id: kimi-k3
        name: Kimi K3
        capabilities: [tool_use, reasoning, vision]
      - id: kimi-k2.6
        name: Kimi K2.6
        capabilities: [tool_use, reasoning, vision]

  - id: kimi-intl
    name: Kimi（国际）
    baseURL: https://api.moonshot.ai/v1
    apiKey: ${MOONSHOT_INTL_API_KEY}
    models:
      - id: kimi-k3
        name: Kimi K3
        capabilities: [tool_use, reasoning, vision]
      - id: kimi-k2.6
        name: Kimi K2.6
        capabilities: [tool_use, reasoning, vision]

  # ---- MiniMax -------------------------------------------------------------
  # Note the extra "i": api.minimaxi.com is the Chinese host and api.minimax.io the
  # international one. They are different hosts, not two spellings of one.
  - id: minimax
    name: MiniMax
    baseURL: https://api.minimaxi.com/v1
    apiKey: ${MINIMAX_API_KEY}
    models:
      - id: MiniMax-M3
        name: MiniMax M3
        capabilities: [tool_use, reasoning, vision]
      - id: MiniMax-M2.7
        name: MiniMax M2.7
        capabilities: [tool_use, reasoning]

  - id: minimax-intl
    name: MiniMax（国际）
    baseURL: https://api.minimax.io/v1
    apiKey: ${MINIMAX_INTL_API_KEY}
    models:
      - id: MiniMax-M3
        name: MiniMax M3
        capabilities: [tool_use, reasoning, vision]
      - id: MiniMax-M2.7
        name: MiniMax M2.7
        capabilities: [tool_use, reasoning]

  # ---- OpenAI --------------------------------------------------------------
  # Deliberately **not** `reasoning`. OpenAI does not expose chain-of-thought as a
  # `reasoning_content` field, so there is nothing to replay — while declaring the capability
  # is what makes this app put that field on the wire. Reasoning still streams and is still
  # displayed: the SSE tap is installed for every model, and only the *replay* is gated.
  - id: openai
    name: OpenAI
    baseURL: https://api.openai.com/v1
    apiKey: ${OPENAI_API_KEY}
    models:
      - id: gpt-5.4
        name: GPT-5.4
        capabilities: [tool_use, vision]
      - id: gpt-5.4-mini
        name: GPT-5.4 mini
        capabilities: [tool_use, vision]

  # ---- Google Gemini -------------------------------------------------------
  # Same omission as OpenAI, for the same reason: Gemini's thinking is not a replayed field.
  # This is the OpenAI-compatibility layer, not the native API.
  - id: gemini
    name: Google Gemini
    baseURL: https://generativelanguage.googleapis.com/v1beta/openai/
    apiKey: ${GEMINI_API_KEY}
    models:
      - id: gemini-3.5-flash
        name: Gemini 3.5 Flash
        capabilities: [tool_use, vision]
      - id: gemini-3.1-pro-preview
        name: Gemini 3.1 Pro (preview)
        capabilities: [tool_use, vision]

  # Local / keyless example — uncomment to use a self-hosted OpenAI-compatible
  # server such as Ollama (http://localhost:11434/v1) or LM Studio. `capabilities` may be
  # omitted for a model whose id names its family, in which case it is guessed from the id.
  # - id: local
  #   name: Local (Ollama)
  #   baseURL: http://localhost:11434/v1
  #   apiKey: none
  #   models:
  #     - id: llama3.1
  #       name: Llama 3.1

# ----------------------------------------------------------------------------
# Document parsing (PDF / Word / Excel / PowerPoint / OpenDocument).
#
# PDF and Office attachments are converted to text before they reach the model.
# Local extraction (pdfjs + a built-in OOXML reader) is always available and
# needs nothing configured. Cloud parsers are optional, and are what makes
# scanned PDFs and complex layouts readable.
#
# `documentParsers` entries are SEED data, same contract as `providers` above:
# copied into the database on first boot, after which Settings → 文档解析 owns
# them. Deleting every parser there is a valid state and will NOT be undone by
# a restart.
# ----------------------------------------------------------------------------
documentParsers: []
  # `kind` picks the wire protocol; `baseURL` + `apiKey` point it at an instance.
  #   sync      — POST a file, get Markdown back. Self-hosted, no key needed:
  #               docling-serve (http://127.0.0.1:5001/v1/convert/file),
  #               Marker, or a self-hosted MinerU.
  #   mineru    — MinerU's async batch API (https://mineru.net/api/v4), or a
  #               self-hosted MinerU exposing the same routes.
  #   llamaparse— LlamaParse v2 (https://api.cloud.llamaindex.ai). Reducto is
  #               the same shape and can be added as another driver.
  #
  # - id: docling
  #   name: Docling (local)
  #   kind: sync
  #   baseURL: http://127.0.0.1:5001/v1/convert/file
  #
  # - id: mineru
  #   name: MinerU
  #   kind: mineru
  #   baseURL: https://mineru.net/api/v4
  #   apiKey: ${MINERU_API_KEY}

documentParsing:
  # Local extraction. Turning this off is only sensible with a cloud parser set
  # as the sole tier (policy: cloud-only).
  localEnabled: true
  # Which tier runs first, and whether the other is used as a fallback:
  #   local-only  — never call out (fully offline)
  #   local-first — local, then cloud if local cannot read the file (default)
  #   cloud-first — cloud, then local
  #   cloud-only  — always call out
  policy: local-first
  # `false` removes the second step from the hybrid policies above, so a failure
  # is reported instead of being retried on the other side.
  fallbackEnabled: true
  # Pin one parser to be tried first. Leave unset to try every enabled parser in
  # the order shown in Settings.
  # defaultParserId: mineru

# ----------------------------------------------------------------------------
# Tool configuration.
# ----------------------------------------------------------------------------
tools:
  webSearch:
    # One of: bing | tavily | duckduckgo | searxng
    #   bing      — free, keyless, server-side scraping of Bing results (default)
    #   tavily    — Tavily Search API (high quality, needs an API key)
    #   duckduckgo— free, keyless, DuckDuckGo HTML endpoint
    #   searxng   — self-hosted SearXNG instance
    provider: bing
    maxResults: 5
    # tavily / bing / duckduckgo / searxng endpoints & keys (only what you use):
    # tavilyApiKey: ${TAVILY_API_KEY}
    # searxngBaseURL: http://localhost:8080
    # bingEndpoint: https://www.bing.com/search

  # Fetches the readable text of a specific URL (the agent can follow up a
  # web_search with this to read a page). Requests to loopback/private/link-local
  # addresses are refused, and every redirect hop is re-checked.
  webFetch:
    enabled: true
    # Cap on how many characters of extracted text are handed to the model.
    maxChars: 20000

  # File tools are always enabled and sandboxed to the active workspace.
  fileTools:
    enabled: true

  # Limits for document text extraction. Usually left alone.
  documents:
    # Above this, local extraction is skipped and the file is offered to a cloud
    # parser instead (whose ceilings are an order of magnitude higher).
    localMaxBytes: 20971520
    # Ceiling on stored extracted text, so one pathological file cannot fill the disk.
    maxTextChars: 2000000
    # How many documents parse at once.
    concurrency: 2
    # Per-HTTP-request budget for a cloud parser.
    requestTimeoutMs: 30000
    # Total budget for one async cloud job, polling included.
    jobTimeoutMs: 300000
    pollIntervalMs: 3000