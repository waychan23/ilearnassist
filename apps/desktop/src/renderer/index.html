<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      A desktop shell, not a page on the web: no navigation, no external subresources, and
      the only scripts are the two files below. `style-src 'self'` is enough because every
      rule ships in panel.css and nothing is inlined at runtime.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'"
    />
    <title>Interactive Learning Assistant</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <div class="header__row">
          <h1 class="wordmark" data-i18n="app.name">Interactive Learning Assistant</h1>
          <!--
            The language control, in the header rather than at the bottom of the panel: it is
            the one setting somebody reaches for *because* they cannot read anything else, so it
            has to be the first thing on the page. The options are built by the renderer —
            two of the three labels are autonyms and never change with the language, and the
            third is a translated phrase.
          -->
          <select class="locale" data-role="locale" data-testid="panel-locale"></select>
        </div>
        <p class="subtitle" data-i18n="app.tagline"></p>
      </header>

      <section class="status" data-state="stopped" aria-live="polite">
        <div class="status__head">
          <span class="status__dot" aria-hidden="true"></span>
          <span class="status__label" data-role="state"></span>
        </div>
        <p class="status__detail" data-role="detail" hidden></p>
        <div class="status__url" data-role="url-row" hidden>
          <code class="status__code" data-role="url"></code>
          <button type="button" class="button button--ghost button--small" data-action="copy"></button>
        </div>
      </section>

      <section class="actions">
        <button type="button" class="button button--primary" data-action="open" disabled></button>
        <div class="actions__row">
          <button type="button" class="button" data-action="start"></button>
          <button type="button" class="button" data-action="stop" disabled></button>
        </div>
        <button type="button" class="button button--link" data-action="browser" disabled></button>
        <!--
          The way back in for a forgotten administrator password, and the only control in this
          panel that reaches into the *accounts* rather than the server process. It lives here
          rather than in the app because the app is exactly what a forgotten password locks
          you out of.
        -->
        <button type="button" class="button button--link" data-action="reset-admin" disabled></button>
      </section>

      <section class="field">
        <div class="field__head">
          <span class="field__label" data-i18n="label.dataDir"></span>
          <span class="field__actions">
            <button type="button" class="button button--link" data-action="reveal"></button>
            <button type="button" class="button button--link" data-action="choose-data-dir"></button>
          </span>
        </div>
        <code class="field__value" data-role="data-dir"></code>
        <!--
          Only until someone has chosen. The server cannot start without a data root, so this
          is the answer to "why is nothing happening" — and it is the only place the reason is
          stated, because the failure it prevents would otherwise be a sentence about an
          environment variable.
        -->
        <p class="field__hint" data-role="data-dir-hint" hidden></p>
      </section>

      <section class="field">
        <div class="field__head">
          <span class="field__label" data-i18n="label.lanAccess"></span>
          <span class="field__actions">
            <!-- Only while sharing is on: a switch that is off needs no "turn it off". -->
            <button type="button" class="button button--link" data-action="unshare" hidden></button>
            <button type="button" class="button button--link" data-action="share"></button>
          </span>
        </div>
        <!-- The address stays on screen while sharing is on, so it can be read out to someone
             whose camera will not cooperate. -->
        <code class="field__value" data-role="lan-url" hidden></code>
      </section>

      <!--
        The one account-level action that has to be available with the server stopped: a
        fresh data folder has no administrator, and the server refuses to listen until one
        exists. Shown only in that state, so on an installation already set up this is never
        drawn. The sheet it opens, not an inline expansion: the form is taller than the panel
        can give it, and an overlay keeps it from shoving the rest of the controls off the
        bottom of a window that does not scroll.
      -->
      <section class="admin" data-role="admin" hidden>
        <p class="admin__hint" data-i18n="hint.needAdmin"></p>
        <button type="button" class="button button--primary" data-action="admin-create"></button>
      </section>

      <p class="note" data-i18n="hint.closeToTray"></p>

      <section class="logs">
        <button
          type="button"
          class="logs__toggle"
          data-action="logs"
          aria-expanded="false"
          aria-controls="log-output"
        >
          <!--
            A stroked chevron, not a "▸". The interface's marks are drawn rather than typed
            so they inherit `currentColor` and rotate with transform; a character glyph
            would be painted by the font and sit off-baseline at this size.
          -->
          <svg class="logs__chevron" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M6 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span data-role="logs-label"></span>
        </button>
        <pre class="logs__output" id="log-output" data-role="logs" hidden></pre>
      </section>

      <!--
        A real overlay rather than a section that expands in place: the QR needs a square of
        room, and growing the panel under it would push the controls the user just pressed
        off the bottom of a window they cannot scroll.
      -->
      <div class="overlay" data-role="qr-overlay" hidden>
        <div class="overlay__scrim" data-action="qr-dismiss"></div>
        <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="qr-title">
          <header class="sheet__head">
            <h2 class="sheet__title" id="qr-title" data-i18n="qr.title"></h2>
            <button type="button" class="button button--link" data-action="qr-dismiss" data-i18n="qr.close"></button>
          </header>

          <!-- Carries the reason when there is no code to show, and is empty otherwise. -->
          <p class="sheet__message" data-role="qr-message" hidden></p>

          <div class="qr" data-role="qr" hidden></div>

          <p class="sheet__hint" data-i18n="qr.steps"></p>

          <div class="sheet__address" data-role="qr-address" hidden>
            <span class="sheet__address-label" data-i18n="qr.address"></span>
            <div class="sheet__address-row">
              <code class="field__value" data-role="qr-url"></code>
              <button type="button" class="button button--small" data-action="qr-copy"></button>
            </div>
          </div>
        </section>
      </div>
      <!--
        The create-administrator sheet, the same overlay pattern as the QR one: a scrim,
        a dialog, and one way to dismiss. Its content is a form with a confirmation field —
        the only time a password is chosen without an old one to prove it against, so a
        typo is unrecoverable. The password is handed to main over IPC and never logged.
      -->
      <div class="overlay" data-role="admin-overlay" hidden>
        <div class="overlay__scrim" data-action="admin-cancel"></div>
        <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="admin-title">
          <header class="sheet__head">
            <h2 class="sheet__title" id="admin-title" data-i18n="create.title"></h2>
            <button type="button" class="button button--link" data-action="admin-cancel" data-i18n="action.cancel"></button>
          </header>

          <p class="sheet__message sheet__message--detail" data-i18n="create.detail"></p>

          <label class="form-field">
            <span class="form-field__label" data-i18n="create.username"></span>
            <input
              class="form-field__input"
              data-role="admin-username"
              type="text"
              autocomplete="username"
              maxlength="64"
            />
          </label>
          <label class="form-field">
            <span class="form-field__label" data-i18n="create.password"></span>
            <input
              class="form-field__input"
              data-role="admin-password"
              type="password"
              autocomplete="new-password"
            />
          </label>
          <label class="form-field">
            <span class="form-field__label" data-i18n="create.confirm"></span>
            <input
              class="form-field__input"
              data-role="admin-confirm"
              type="password"
              autocomplete="new-password"
            />
          </label>

          <p class="sheet__message" data-role="admin-error" role="alert" hidden></p>
          <p class="sheet__message sheet__message--ok" data-role="admin-ok" role="status" hidden></p>

          <div class="sheet__actions">
            <button type="button" class="button button--link" data-action="admin-cancel" data-i18n="action.cancel"></button>
            <button type="button" class="button button--primary" data-action="admin-submit" data-i18n="create.submit"></button>
          </div>
        </section>
      </div>
      <!--
        The reset-administrator sheet, the same overlay pattern as the create one. The
        operator is taken to be the superadmin at this machine, so they choose the new
        password here (with a confirmation field — there is no old one to check against)
        rather than being handed a generated one. The password goes to main over IPC and
        reaches the one-shot child on stdin.
      -->
      <div class="overlay" data-role="reset-overlay" hidden>
        <div class="overlay__scrim" data-action="reset-cancel"></div>
        <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="reset-title">
          <header class="sheet__head">
            <h2 class="sheet__title" id="reset-title" data-i18n="reset.title"></h2>
            <button type="button" class="button button--link" data-action="reset-cancel" data-i18n="action.cancel"></button>
          </header>

          <p class="sheet__message sheet__message--detail" data-i18n="reset.detail"></p>

          <label class="form-field">
            <span class="form-field__label" data-i18n="reset.newPassword"></span>
            <input
              class="form-field__input"
              data-role="reset-password"
              type="password"
              autocomplete="new-password"
            />
          </label>
          <label class="form-field">
            <span class="form-field__label" data-i18n="create.confirm"></span>
            <input
              class="form-field__input"
              data-role="reset-confirm"
              type="password"
              autocomplete="new-password"
            />
          </label>

          <p class="sheet__message" data-role="reset-error" role="alert" hidden></p>
          <p class="sheet__message sheet__message--ok" data-role="reset-ok" role="status" hidden></p>

          <div class="sheet__actions">
            <button type="button" class="button button--link" data-action="reset-cancel" data-i18n="action.cancel"></button>
            <button type="button" class="button button--primary" data-action="reset-submit" data-i18n="reset.submit"></button>
          </div>
        </section>
      </div>
    </main>

    <!--
      A classic script, not a module. The panel is loaded from `file://`, where Chromium
      refuses module scripts outright ("origin 'null' has been blocked by CORS policy"), so
      the renderer bundle is built as an IIFE. `defer` keeps it off the parser's critical
      path while still running before `DOMContentLoaded`.
    -->
    <script src="panel.js" defer></script>
  </body>
</html>
