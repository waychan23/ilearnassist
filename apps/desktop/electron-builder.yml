# Packaging for the desktop control panel.
#
# `pnpm --filter @ilearnassist/desktop package` produces `release/*.dmg`.
#
# Two settings below are load-bearing and not the defaults. Read their comments before
# changing them.

appId: com.ilearnassist.desktop
productName: ilearnassist

# Spelled out because the default is the package *name*, and this package is scoped:
# `@ilearnassist/desktop` sanitises to `@ilearnassistdesktop`, whose `@` AppImage refuses
# outright —
#
#   failed to build AppImage  error=executableName contains characters that cannot be safely
#   used in file paths: @ilearnassistdesktop. Please use only letters, digits, hyphens,
#   underscores, dots, and spaces.
#
# — so a Linux package could not be built at all. Top level rather than under `linux:`
# because the same default feeds the Windows executable name, and `productName` is not a
# substitute for it. The macOS `.app` takes its name from `productName` and ignores this.
executableName: ilearnassist

directories:
  # Not the conventional `build/`: that name is ignored by the repo-wide `.gitignore`, and
  # this directory holds the committed icon, not build output.
  buildResources: assets
  output: release

# The app is `dist/` plus its two runtime dependencies. `package.json` comes along because
# Electron reads `main` out of it to find the entry point.
files:
  - dist/**
  - package.json
  - "!dist/resources/**"

# The unbundled half — the built frontend and the seed config. These land in
# `Contents/Resources/`, outside the app directory, which is where `main.ts` looks when
# `app.isPackaged` is true.
extraResources:
  - from: dist/resources
    to: .

# Not the default, and deliberate.
#
# The app's whole writable state lives under the user's data directory, so there is nothing
# to protect by sealing the code up, and an archive buys a packaged app nothing it needs.
# What it costs is real: the server runs as a *child process* and Node has to resolve two
# packages out of the tree — `better-sqlite3` (a native addon that `dlopen`s a `.node` from
# its `prebuilds/` directory) and `pdfjs-dist` (whose legacy build Node imports by ESM path).
# Both of those go through filesystem calls that an asar archive intercepts, from a process
# that is not the one Electron patched for it. Leaving the tree unpacked removes the question.
asar: false

# Also not the default. `better-sqlite3` v13 ships N-API prebuilds
# (`prebuilds/darwin-arm64.node` and friends), and N-API binaries are ABI-stable across Node
# and Electron versions — so the binary built for this machine's Node is already correct for
# the Electron runtime that loads it. Rebuilding would mean a network fetch or a full
# `node-gyp` compile at package time to produce a byte-different equivalent of a file we
# already have.
npmRebuild: false

# Re-signs the finished bundle ad-hoc when there is no Developer ID identity to use.
#
# Without it the `.dmg` installs an app that macOS refuses to open as *"damaged"* — the one
# Gatekeeper message that right-click → Open cannot dismiss, because it is a signature that
# no longer matches the bundle rather than a trust prompt. See the script for the full
# reasoning, and `docs/desktop.md` → Signing for what a real certificate would add.
afterSign: ./scripts/after-sign.mjs

mac:
  category: public.app-category.productivity
  icon: assets/icon.icns
  darkModeSupport: true
  # One arch by default so a bare `pnpm package` is quick on the machine you are developing
  # on. `pnpm package:mac` (see package.json) builds both, which is what a release needs —
  # the two architectures need separate Electron binaries and produce separate disk images.
  target:
    - target: dmg
      arch:
        - arm64

dmg:
  title: ilearnassist ${version}
  # The standard install gesture: drag the app onto Applications. Spelling it out rather
  # than relying on the default layout, because the default leaves the two icons overlapping
  # the window edge at some sizes.
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications

# NSIS rather than Squirrel, and that choice is what keeps `electron-winstaller` set to
# `false` in `pnpm-workspace.yaml` — that package is Squirrel's Windows-only toolchain, and
# NSIS uses the makensis binaries electron-builder fetches itself. `oneClick: false` because
# the audience for this app installs things by clicking through a wizard: a one-click
# installer gives no chance to choose a location and no visible uninstaller.
win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Per-user rather than per-machine: installing for everybody needs elevation, and this app
  # never writes anywhere that requires it — its own state is under `app.getPath("userData")`
  # and the user's data is wherever they chose on first launch.
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  icon: assets/icon-512.png
  category: Education
  synopsis: Interactive learning assistant
  description: >-
    A self-hosted learning assistant: workspaces, conversations, a study-plan and quiz panel,
    and an agent loop over any OpenAI-compatible model. Your data lives in a folder you choose.
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  # Debian policy requires one. There is no better answer available from here: electron-builder
  # will not infer it, and a package with an empty maintainer is one apt complains about.
  maintainer: ilearnassist contributors

# Spelled out rather than left to the default, which is `<productName>-<version>-<arch>` with
# no platform segment — so the Mac and Windows artefacts of one release would be told apart
# only by their extension, and `release/` would still hold a mis-named `.dmg` from before the
# product rename. `${os}` is electron-builder's own platform token.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
